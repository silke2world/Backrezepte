<!doctype html>
<html lang="de">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mein Backbuch</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Mein Backbuch</h1>
  <p>Rezepte · Backzeiten · Backmodus</p>
</header>

<main>

<section class="hero">

  <h2>Meine Rezepte</h2>

  <input
    id="search"
    placeholder="Rezept suchen …"
  >

</section>

<div id="recipes"></div>

</main>


<script>

const el = document.getElementById("recipes");
const search = document.getElementById("search");

let data = [];


async function load() {

  try {

    console.log("1. Lade rezepte.json");

    const response = await fetch(
      "rezepte.json?v=" + Date.now()
    );

    console.log("rezepte.json Status:", response.status);

    if (!response.ok) {
      throw new Error(
        "rezepte.json HTTP " + response.status
      );
    }

    const index = await response.json();

    console.log("2. Rezeptliste:", index);


    data = await Promise.all(

      index.recipes.map(async file => {

        console.log("3. Lade:", file);

        const response = await fetch(
          "rezepte/" + file + "?v=" + Date.now()
        );

        console.log(
          file,
          "Status:",
          response.status
        );

        if (!response.ok) {
          throw new Error(
            file + " HTTP " + response.status
          );
        }

        const recipe = await response.json();

        console.log(
          "4. Rezept geladen:",
          recipe
        );

        return recipe;

      })

    );


    console.log(
      "5. Alle Rezepte:",
      data
    );

    render();


  } catch (error) {

    console.error(
      "FEHLER:",
      error
    );

    el.innerHTML = `
      <section class="panel">

        <h2>Fehler beim Laden</h2>

        <p>${error.message}</p>

        <p>
          Details stehen in der Browser-Konsole.
        </p>

      </section>
    `;

  }

}


function render() {

  const q =
    search.value.toLowerCase();


  el.innerHTML = data

    .filter(r =>
      r.title &&
      r.title.toLowerCase().includes(q)
    )

    .map(r => `

      <article class="card">

        <div>

          <span class="tag">
            ${r.category || ""}
          </span>

          <h2>
            ${r.title}
          </h2>

          <p>
            ${r.portions || ""} Teiglinge
          </p>

          <a
            class="button"
            href="rezept.html?id=${encodeURIComponent(r.id)}"
          >
            Rezept öffnen
          </a>

        </div>

      </article>

    `)

    .join("");

}


search.oninput = render;

load();

</script>

</body>
</html>
