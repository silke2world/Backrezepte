<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Rezept</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a href="index.html">← Backrezepte</a>
</header>

<main>

  <section class="recipe-head">
    <span id="category" class="tag"></span>
    <h1 id="title">Rezept</h1>
    <p id="portions"></p>

    <div id="recipe-images" class="recipe-images"></div>
  </section>

  <section id="recipe-sections" class="recipe-sections"></section>

</main>


<script>

const params = new URLSearchParams(window.location.search);
const recipeId = params.get("id");

const recipeContainer = document.getElementById("recipe-sections");

if (!recipeId) {
  recipeContainer.innerHTML = "<p>Kein Rezept angegeben.</p>";
} else {
  loadRecipe();
}


async function loadRecipe() {

  try {

    console.log("Lade Rezept:", recipeId);

    const response = await fetch("rezepte/" + recipeId + ".json");

    if (!response.ok) {
      throw new Error("Rezept konnte nicht geladen werden.");
    }

    const recipe = await response.json();

    document.title = recipe.title + " – Backrezepte";

    document.getElementById("title").textContent = recipe.title;

    document.getElementById("category").textContent =
      recipe.category || "";

    if (recipe.portions) {
      document.getElementById("portions").textContent =
        recipe.portions + " Stück";
    }


    /*
     * FOTOS
     */

    const imageContainer =
      document.getElementById("recipe-images");

    if (recipe.images && recipe.images.length > 0) {

      recipe.images.forEach(image => {

        const img = document.createElement("img");

        img.src = "images/" + image;
        img.alt = recipe.title;

        imageContainer.appendChild(img);

      });

    }


    /*
     * REZEPTABSCHNITTE
     */

    recipeContainer.innerHTML = "";

    recipe.steps.forEach((step, index) => {

      const section =
        document.createElement("section");

      section.className = "recipe-section";


      /*
       * ÜBERSCHRIFT
       */

      const heading =
        document.createElement("h2");

      const title =
        document.createElement("span");

      title.textContent = step.title;

      heading.appendChild(title);


      /*
       * Zeitinformationen
       */

      const meta =
        document.createElement("span");

      meta.className = "step-meta";

      let metaText = "";

      if (step.day) {
        metaText += " · Tag " + step.day;
      }

      if (step.time) {
        metaText += " · " + step.time;
      }

      if (step.duration) {
        metaText += " · " + formatDuration(step.duration);
      }

      meta.textContent = metaText;

      heading.appendChild(meta);

      section.appendChild(heading);


      /*
       * ZWEI SPALTEN
       */

      const grid =
        document.createElement("div");

      grid.className = "recipe-grid";


      /*
       * LINKE SPALTE
       */

      const left =
        document.createElement("div");

      left.className = "recipe-left";


      /*
       * Bei einem stage kommen automatisch
       * die passenden Zutaten aus ingredients.
       */

      if (step.stage) {

        const ingredients =
          recipe.ingredients.filter(
            ingredient =>
              ingredient.stage === step.stage
          );

        ingredients.forEach((ingredient, ingredientIndex) => {

          const label =
            document.createElement("label");

          label.className = "ingredient-check";


          const checkbox =
            document.createElement("input");

          checkbox.type = "checkbox";


          const key =
            recipe.id +
            "_step_" +
            index +
            "_ingredient_" +
            ingredientIndex;

          checkbox.checked =
            localStorage.getItem(key) === "true";


          checkbox.addEventListener("change", () => {
